<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sube tus fotos 💖</title>
<style>
  :root { --rosa:#d6336c; --fondo:#fff7fa; --texto:#2b2b2b; --gris:#777; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fondo); color:var(--texto); }
  main { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  p { line-height:1.5; margin:8px 0; }
  .sub { color:var(--gris); font-size:.95rem; }
  .boton { display:block; width:100%; padding:16px; border:0; border-radius:14px; font-size:1.05rem; font-weight:700; cursor:pointer; margin-top:14px; }
  .elegir { background:#fff; color:var(--rosa); border:2px dashed var(--rosa); }
  .subir { background:var(--rosa); color:#fff; }
  .subir:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .item { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#eee; }
  .item img, .item video { width:100%; height:100%; object-fit:cover; display:block; }
  .item .quitar { position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:50%; width:26px; height:26px; font-size:16px; cursor:pointer; }
  .item .estado { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55); color:#fff; font-size:.75rem; text-align:center; padding:3px; }
  .aviso { background:#fff; border-radius:14px; padding:14px; margin-top:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .error { color:#b00020; }
  .ok { text-align:center; padding:30px 10px; }
  .ok h2 { color:var(--rosa); }
  input[type=file] { display:none; }
</style>
</head>
<body>
<main id="app">
  <p class="sub">Cargando…</p>
</main>
<script>
const PUENTE = "https://ftnodsxqhebiuelfytjo.supabase.co/functions/v1/puente";
const MAX = 15, MAX_MB_VIDEO = 50;
const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("id");
let archivos = [];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function pintarError(msg) {
  app.innerHTML = `<h1>Ups 🙏</h1><p class="error">${esc(msg)}</p><p class="sub">Si crees que es un error, escríbenos por WhatsApp.</p>`;
}

// Reduce el tamaño de las fotos antes de subirlas (más rápido y liviano).
function comprimir(file) {
  return new Promise((ok) => {
    if (!file.type.startsWith("image/") || file.type === "image/gif") return ok(file);
    const img = new Image();
    img.onload = () => {
      const lado = 1600, esc = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => ok(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => ok(file);
    img.src = URL.createObjectURL(file);
  });
}

function pintar(nombre) {
  app.innerHTML = `
    <h1>📸 Fotos para el video${nombre ? " de " + esc(nombre) : ""}</h1>
    <p>Elige tus fotos y videos favoritos (hasta ${MAX}). Aparecerán en el video con la canción de fondo 🎶</p>
    <p class="sub">Videos de máximo ${MAX_MB_VIDEO} MB. Puedes elegir varios a la vez.</p>
    <label class="boton elegir" for="sel">➕ Elegir fotos y videos</label>
    <input id="sel" type="file" accept="image/*,video/*" multiple>
    <div class="grid" id="grid"></div>
    <div id="msg"></div>
    <button class="boton subir" id="subir" disabled>Subir y terminar</button>`;
  document.getElementById("sel").onchange = (e) => agregar([...e.target.files]);
  document.getElementById("subir").onclick = subir;
}

function agregar(nuevos) {
  const msg = document.getElementById("msg");
  msg.innerHTML = "";
  for (const f of nuevos) {
    if (archivos.length >= MAX) { msg.innerHTML = `<p class="error">Máximo ${MAX} archivos.</p>`; break; }
    const esVideo = f.type.startsWith("video/");
    if (!esVideo && !f.type.startsWith("image/")) continue;
    if (esVideo && f.size > MAX_MB_VIDEO * 1024 * 1024) {
      msg.innerHTML = `<p class="error">El video "${esc(f.name)}" pesa más de ${MAX_MB_VIDEO} MB. Elige uno más corto.</p>`;
      continue;
    }
    archivos.push({ file: f, tipo: esVideo ? "video" : "image", url: URL.createObjectURL(f) });
  }
  redibujar();
}

function redibujar() {
  const g = document.getElementById("grid");
  g.innerHTML = archivos.map((a, i) => `
    <div class="item">
      ${a.tipo === "video" ? `<video src="${a.url}" muted playsinline></video>` : `<img src="${a.url}" alt="">`}
      <button class="quitar" data-i="${i}" aria-label="Quitar">×</button>
      <div class="estado" id="st${i}">${a.tipo === "video" ? "🎬 video" : ""}</div>
    </div>`).join("");
  g.querySelectorAll(".quitar").forEach((b) => b.onclick = () => { archivos.splice(+b.dataset.i, 1); redibujar(); });
  document.getElementById("subir").disabled = archivos.length === 0;
}

async function subir() {
  const btn = document.getElementById("subir"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Subiendo… no cierres esta página";
  document.querySelectorAll(".quitar").forEach((b) => b.remove());
  try {
    const r = await fetch(`${PUENTE}/subida?id=${id}&n=${archivos.length}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "No se pudo preparar la subida");
    const listos = [];
    for (let i = 0; i < archivos.length; i++) {
      const a = archivos[i], st = document.getElementById("st" + i);
      st.textContent = "Subiendo…";
      const cuerpo = await comprimir(a.file);
      const put = await fetch(j.permisos[i].signedUrl, {
        method: "PUT",
        headers: { "Content-Type": cuerpo.type || a.file.type || "application/octet-stream" },
        body: cuerpo,
      });
      if (!put.ok) { st.textContent = "❌"; continue; }
      st.textContent = "✅";
      listos.push({ path: j.permisos[i].path, tipo: a.tipo });
    }
    if (!listos.length) throw new Error("No se pudo subir ningún archivo. Revisa tu internet e inténtalo otra vez.");
    const fin = await fetch(`${PUENTE}/subida-lista`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, archivos: listos }),
    });
    if (!fin.ok) throw new Error((await fin.json()).error || "No se pudo terminar");
    app.innerHTML = `<div class="ok"><h2>¡Listo! 💖</h2>
      <p>Recibimos ${listos.length} archivo${listos.length > 1 ? "s" : ""}.</p>
      <p><b>Vuelve a WhatsApp y escribe LISTO</b> para que empecemos a crear tu video 🎬</p></div>`;
  } catch (e) {
    msg.innerHTML = `<p class="error">${esc(e.message)}</p>`;
    btn.disabled = false; btn.textContent = "Intentar de nuevo";
  }
}

(async () => {
  if (!id) return pintarError("Este enlace no es válido.");
  try {
    const r = await fetch(`${PUENTE}/subida?id=${encodeURIComponent(id)}&n=0`);
    const j = await r.json();
    if (!r.ok) return pintarError(j.error === "este pedido ya recibió sus fotos"
      ? "Ya recibimos tus fotos para este pedido 💖 Vuelve a WhatsApp y escribe LISTO."
      : "No encontramos este pedido.");
    pintar(j.nombre);
  } catch { pintarError("No hay conexión. Revisa tu internet e inténtalo otra vez."); }
})();
</script>
</body>
</html>
